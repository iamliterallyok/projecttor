<script>
ongr = false;
setTimeout(function() {
document.getElementsByClassName("hyperlink selected")[0].style.backgroundColor = "#c12020";
document.getElementsByClassName("hplabel selected")[0].style.backgroundColor = "#c12020";
document.getElementById("sidebar").style.outlineColor = "#c12020";
document.getElementById("outtab").style.backgroundColor = "#c12020";
document.getElementById("undathatoolbar").style.backgroundColor = "#c12020";
document.getElementById("buttontoscroll").style.backgroundColor = "#c12020";
document.getElementsByClassName("sslogo")[0].style.opacity = 0;
document.getElementById("ll2").style.opacity = 0;
for (i = 0; i < document.getElementsByClassName("liltext").length; i++) {
  document.getElementsByClassName("liltext")[i].style.color = "#c12020";
}
for (i = 0; i < 6; i++) {
  document.getElementsByClassName("hyperlink")[i+1].style.color = "#c12020";
}
for (i = 0; i < 6; i++) {
  document.getElementsByClassName("hpimg")[i+1].style.opacity = 0;
}
}, 1);

function scrolle() { 
  lastdot = (document.getElementById("stuff").offsetWidth + document.getElementById("stuff").offsetLeft) + 0.035 * window.innerHeight;
  btndot = document.getElementById("buttontoscroll").offsetLeft;
  document.getElementById("greygradient2").classList.add("hidden");
  allthewayleft = false;
  if (lastdot > btndot * 2) {
    distance = btndot;
  } else {
    distance = lastdot - btndot;
    setTimeout(function() {
    document.getElementById("buttontoscroll").setAttribute("onclick", "goback()");
    document.getElementById("btsimg").style.transform = "rotateZ(180deg)";
    }, 1);
  }
  document.getElementById("stuff").style.left = document.getElementById("stuff").offsetLeft - distance + "px";
}

function goback() {
  setTimeout(function() {
  document.getElementById("buttontoscroll").setAttribute("onclick", "scrolle()");
  document.getElementById("btsimg").style.transform = "rotateZ(0deg)";
  }, 1);
  document.getElementById("greygradient2").classList.add("hidden");
  allthewayleft = true;
  document.getElementById("stuff").style.left = "0dvh";
}

setInterval(function() {
  if (ongr) {
    ongr = false;
    document.getElementsByClassName("hyperlink selected")[0].style.backgroundColor = "#c12020";
    document.getElementsByClassName("hplabel selected")[0].style.backgroundColor = "#c12020";
    document.getElementById("sidebar").style.outlineColor = "#c12020";
    document.getElementById("outtab").style.backgroundColor = "#c12020";
    document.getElementById("buttontoscroll").style.backgroundColor = "#c12020";
    document.getElementById("undathatoolbar").style.backgroundColor = "#c12020";
    document.getElementsByClassName("sslogo")[0].style.opacity = 0;
    document.getElementById("ll2").style.opacity = 0;

    for (i = 0; i < document.getElementsByClassName("liltext").length; i++) {
      document.getElementsByClassName("liltext")[i].style.color = "#c12020";
    } 
    for (i = 0; i < 6; i++) {
      document.getElementsByClassName("hyperlink")[i+1].style.color = "#c12020";
    }
    for (i = 0; i < 6; i++) {
      document.getElementsByClassName("hpimg")[i+1].style.opacity = 0;
    }
  } else {
    ongr = true;
    document.getElementsByClassName("hyperlink selected")[0].style.backgroundColor = "#ff8500";
    document.getElementsByClassName("hplabel selected")[0].style.backgroundColor = "#ff8500";
    document.getElementById("sidebar").style.outlineColor = "#ff8500";
    document.getElementById("outtab").style.backgroundColor = "#ff8500";
    document.getElementById("buttontoscroll").style.backgroundColor = "#ff8500";
    document.getElementById("undathatoolbar").style.backgroundColor = "#ff8500";
    document.getElementsByClassName("sslogo")[0].style.opacity = 1;
    document.getElementById("ll2").style.opacity = 1;

    for (i = 0; i < document.getElementsByClassName("liltext").length; i++) {
      document.getElementsByClassName("liltext")[i].style.color = "#ff8500";
    }
    for (i = 0; i < 6; i++) {
      document.getElementsByClassName("hyperlink")[i+1].style.color = "#ff8500";
    }
    for (i = 0; i < 6; i++) {
      document.getElementsByClassName("hpimg")[i+1].style.opacity = 1;
    }
  }
}, 4000);

allthewayleft = true;
checkresize();
window.addEventListener("resize", checkresize);
function checkresize() {
  lastne = document.getElementsByClassName("liltext")[document.getElementsByClassName("liltext").length-1];
  if (document.getElementById("stuff").offsetWidth + document.getElementById("stuff").offsetLeft + 0.035 * window.innerHeight > document.getElementById("buttontoscroll").offsetLeft || allthewayleft == false) {
    document.getElementById("greygradient").classList.remove("hidden");
    document.getElementById("buttontoscroll").classList.remove("hidden");
  } else {
    document.getElementById("greygradient").classList.add("hidden");
    document.getElementById("buttontoscroll").classList.add("hidden");
  }
}

out = true;
function toglsdb() {
  if (out) {
    out = false;
    document.getElementById("sidebar").style.left = "-14.9dvh";
    document.getElementById("toptoolbar").style.width = "100%";
    document.getElementById("undathatoolbar").style.width = "100%";
    document.getElementById("content").style.width = "100%";
  } else {
    out = true;
    document.getElementById("sidebar").style.left = "0dvh";
    document.getElementById("toptoolbar").style.width = "calc(100% - 14.9dvh)";
    document.getElementById("undathatoolbar").style.width = "calc(100% - 14.9dvh)";
    document.getElementById("content").style.width = "calc(100% - 14.9dvh)";
  }
  for (i = 0; i < 100; i++) {
    setTimeout(checkresize, i*10);
  }
}
</script>
